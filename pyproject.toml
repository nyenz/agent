[project]
name = "fanout"
dynamic = ["version"]
description = "Send different prompts to several logged-in AI chat sites at once and compare the answers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_tk: needs a working Tkinter and a display"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
