<!doctype html>
<title>Fake chat site A</title>
<style>
  body { font-family: sans-serif; margin: 0; padding-top: 70px; }
  #composer { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px; display: flex; gap: 8px; }
  #prompt-textarea { flex: 1; min-height: 40px; border: 1px solid #888; padding: 6px; }
</style>
<div id="thread">
  <div data-message-author-role="user">hi</div>
  <div data-message-author-role="assistant" class="markdown">hello there</div>
</div>
<div id="composer">
  <div id="prompt-textarea" contenteditable="true" role="textbox"></div>
  <!-- like many real sites, the send button only appears once there is text -->
  <button data-testid="send-button" aria-label="Send message" style="display:none">Go</button>
</div>
<script>
  window.clicks = 0; window.sent = 0;
  const box = document.getElementById("prompt-textarea");
  const btn = document.querySelector("button");
  box.addEventListener("input", () => { btn.style.display = box.innerText.trim() ? "inline-block" : "none"; });
  btn.addEventListener("click", () => { window.sent++; });
  document.addEventListener("click", () => { window.clicks++; });
</script>
