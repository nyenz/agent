name: Release

# Runs when a version tag such as v0.3.0 is pushed. Builds the three programs, makes the source zip the
# in-app updater uses (plus its checksum), and publishes the Release with notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            spec: packaging/windows.spec
          - os: macos-latest
            name: macos
            spec: packaging/macos.spec
          - os: ubuntu-latest
            name: linux
            spec: packaging/linux.spec
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux needs Tk and a few libraries to build
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Build the Windows installer (FanOut-Setup.exe, with Chromium inside)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Put Chromium inside the playwright package so the program carries its own
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          python -m playwright install chromium
      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          python -m PyInstaller --noconfirm ${{ matrix.spec }}
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.name }}" = "macos" ]; then
            ditto -c -k --sequesterRsrc --keepParent FanOut.app "FanOut-${{ matrix.name }}-${{ github.ref_name }}.zip"
          else
            python -c "import shutil; shutil.make_archive('FanOut-${{ matrix.name }}-${{ github.ref_name }}', 'zip', '.', 'FanOut')"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FanOut-${{ matrix.name }}
          path: |
            dist/FanOut-${{ matrix.name }}-${{ github.ref_name }}.zip
            dist/FanOut-Setup-*.exe
            dist/FanOut-Setup-*.exe.sha256

  publish:
    needs: build
    # Publish even if one packaged build failed: the source zip + checksum (what in-app updates use) never depend on PyInstaller.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p assets
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: assets
          merge-multiple: true
      - name: Source zip and checksum (used by the in-app updater)
        run: |
          git archive --format=zip --prefix=FanOut-source/ -o "assets/FanOut-source-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"
          cd assets
          sha256sum "FanOut-source-${GITHUB_REF_NAME}.zip" > "FanOut-source-${GITHUB_REF_NAME}.zip.sha256"
      - name: Notes from CHANGELOG.md
        run: python packaging/release_notes.py "${GITHUB_REF_NAME}" > notes.md
      - name: Create the Release (or fill it in, if it was started by hand on GitHub's Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" assets/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "FanOut ${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" assets/* --title "FanOut ${GITHUB_REF_NAME}" --notes-file notes.md
          fi
